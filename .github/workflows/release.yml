# Reusable Linux release workflow for any compiled desktop app: native
# x86_64 + aarch64 legs on a pinned glibc baseline, .deb + .rpm + Arch
# .pkg.tar.zst via nfpm, AppImage via linuxdeploy, one GPG key signing the
# AppImage + the RPM + the Arch package + a SHA256SUMS manifest, a source
# SBOM, GitHub build-provenance attestations, changelog guard, pre-publish
# verification, and cross-repo publishing to a public releases mirror.
#
# The sibling tauri-release-kit owns Tauri apps (its bundler emits these same
# formats). This kit is for everything else — iced, COSMIC, egui, GTK-rs,
# C, Go, anything that produces one ELF binary plus a .desktop file and an
# icon. The build step is yours (`build_command`); packaging, signing,
# verification and publishing are the kit's.
#
# Conventions this workflow assumes about the calling repo:
#   - CHANGELOG.md with a `## [X.Y.Z...]` heading per released tag
#   - an nfpm config (default packaging/linux/nfpm.yaml) that reads the
#     RK_* variables this workflow exports — see templates/nfpm.yaml
#   - a .desktop file and a PNG icon for the AppImage (defaults:
#     packaging/linux/<product_name>.desktop and .png)
#   - for Rust apps (rust: true, the default): a cargo project at the repo
#     root whose release profile builds `target/<triple>/release/<binary>`;
#     a rust-toolchain.toml is honored if present
#
# THE GLIBC RULE: every leg builds on ubuntu-24.04 by default (runner_x86_64 /
# runner_aarch64). glibc is forward-compatible only — a binary built on a
# newer image dies on older distros with "GLIBC_2.xx not found", and the
# AppImage does NOT bundle glibc. Raise the baseline deliberately, never by
# following `ubuntu-latest`. 24.04 means glibc 2.39: Ubuntu 24.04+, Debian 13+,
# Fedora 40+, RHEL 10+. Flatpak and Snap are exempt (they ship their own
# runtime), which is why those workflows run on newer images.
#
# SIGNING is optional and degrades gracefully: no LINUX_GPG_PRIVATE_KEY ships
# unsigned artifacts with a notice (nothing on Linux refuses to run them). A
# key that is PRESENT but fails to sign is a hard failure — appimagetool
# otherwise emits a byte-identical *unsigned* AppImage and exits 0.
#
# PRIVATE app repos MUST set `releases_repo` to a PUBLIC repo + provide
# RELEASES_TOKEN: private-repo release assets 404 for unauthenticated users,
# and the AUR/COPR/Flatpak workflows downstream all download them anonymously.
#
# RESUMABLE: a run for a tag that already has a DRAFT release reuses that
# draft, so a partially failed release is retried via workflow_dispatch with
# `build_targets` set to just the failed leg — the other leg's assets are kept.

name: Linux release (reusable)

on:
  workflow_call:
    inputs:
      app_display_name:
        description: 'Human name used in release titles, e.g. "MyApp"'
        required: true
        type: string
      product_name:
        description: >-
          Filename stem of every asset (<product>_<version>_amd64.deb,
          <product>-<version>-1.x86_64.rpm, <product>_<version>_x86_64.AppImage).
          Lowercase, no spaces — the AUR/COPR/Flatpak workflows match on it.
        required: true
        type: string
      binary_name:
        description: 'Executable name the build produces. Defaults to product_name.'
        required: false
        type: string
        default: ''
      tag:
        description: 'Tag to release (vX.Y.Z[-suffix]); defaults to the pushed tag ref'
        required: false
        type: string
        default: ''
      releases_repo:
        description: >-
          'owner/name' of the repo that hosts the GitHub releases. Empty = this
          repo. REQUIRED (with the RELEASES_TOKEN secret) when the app repo is
          private — private release assets 404 anonymously.
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated platform set the app SHIPS (subset of: linux-x86_64,
          linux-aarch64). Drives the build matrix and release verification.
        required: false
        type: string
        default: 'linux-x86_64,linux-aarch64'
      build_targets:
        description: >-
          Comma-separated subset of `targets` to BUILD in this run. Empty =
          all. Retry lever: re-dispatch with the SAME tag and only the failed
          leg — the run reuses the draft and its already-uploaded assets.
        required: false
        type: string
        default: ''
      formats:
        description: >-
          Comma-separated package formats (subset of: deb, rpm, appimage,
          arch). deb is what the Flatpak, AUR and Snap workflows repack; rpm
          is what COPR repacks; arch is a native pacman .pkg.tar.zst — what
          arch-repo.yml publishes and `pacman -U <url>` installs directly.
          Every listed format must be produced on every leg.
        required: false
        type: string
        default: 'deb,rpm,appimage'
      build_command:
        description: >-
          Shell command that builds the binary for the current leg. Runs with
          RK_TARGET (Rust triple), RK_ARCH (x86_64|aarch64), RK_DEB_ARCH
          (amd64|arm64), RK_RPM_ARCH, RK_VERSION (bare semver), RK_TAG,
          RK_BINARY and RK_PRODUCT exported. Defaults to a cargo release
          build for RK_TARGET.
        required: false
        type: string
        default: 'cargo build --release --locked --target "$RK_TARGET"'
      binary_path:
        description: >-
          Where build_command leaves the binary; the RK_* variables are
          expanded. Default: target/$RK_TARGET/release/$RK_BINARY
        required: false
        type: string
        default: 'target/$RK_TARGET/release/$RK_BINARY'
      rust:
        description: >-
          Install the Rust toolchain (honoring rust-toolchain.toml) with the
          leg's target, cache the cargo workspace, and run the fmt + clippy
          gates before building. Set false for non-Rust apps.
        required: false
        type: boolean
        default: true
      rust_gates:
        description: 'With rust: true, fail the leg on `cargo fmt --check` or `cargo clippy -D warnings` before building.'
        required: false
        type: boolean
        default: true
      rust_workspace_dir:
        description: >-
          Directory holding Cargo.lock + target/. The fmt/clippy gates, the
          cargo cache, build_command and binary_path all run relative to it.
          Default: repo root.
        required: false
        type: string
        default: '.'
      apt_packages:
        description: >-
          Space-separated extra apt packages the BUILD needs (-dev headers,
          e.g. libgtk-4-dev libxkbcommon-dev). Runtime dependencies belong in
          nfpm.yaml, not here.
        required: false
        type: string
        default: ''
      nfpm_config:
        description: 'Path to the nfpm config used for deb + rpm. See templates/nfpm.yaml.'
        required: false
        type: string
        default: 'packaging/linux/nfpm.yaml'
      nfpm_version:
        description: "nfpm release to install (e.g. 'v2.43.0'). Empty = latest."
        required: false
        type: string
        default: ''
      desktop_file:
        description: '.desktop entry for the AppImage. Default: packaging/linux/<product_name>.desktop'
        required: false
        type: string
        default: ''
      icon:
        description: >-
          PNG icon for the AppImage (256x256 recommended). Its basename
          (without .png) must equal the desktop file's Icon= key. Default:
          packaging/linux/<product_name>.png
        required: false
        type: string
        default: ''
      metainfo:
        description: >-
          Optional AppStream MetaInfo XML, installed into the AppImage at
          usr/share/metainfo/. (deb/rpm take theirs from nfpm.yaml.)
        required: false
        type: string
        default: ''
      appimage_extra_args:
        description: >-
          Extra linuxdeploy arguments, e.g. '--plugin gtk' (after installing
          the plugin in build_command) or additional '-l /path/lib.so'.
        required: false
        type: string
        default: ''
      appimage_update_info:
        description: >-
          AppImage self-update. Empty = off. Otherwise the update information
          embedded in the AppImage, normally
          'gh-releases-zsync|<owner>|<repo>|latest|<product>_*_$RK_ARCH.AppImage.zsync'
          where <owner>/<repo> is where the release assets are served
          (releases_repo when set). The RK_* variables are expanded per leg,
          so one value serves both architectures. The matching .zsync is
          uploaded next to the AppImage.
        required: false
        type: string
        default: ''
      smoke_test:
        description: >-
          Before uploading, check the packages on each leg's own runner: the
          .deb's Version matches the tag and it installs with every linked
          library resolved, and the AppImage launches under Xvfb and is still
          running after 15 s. The app must stay up that long without a GPU or
          user input (see smoke_args).
        required: false
        type: boolean
        default: false
      smoke_args:
        description: >-
          Arguments passed to the app for the smoke_test launch (space-
          separated), e.g. a flag that opens an empty window or skips a
          first-run dialog. Must NOT make it exit: the test requires it alive
          when the 15 s timeout fires.
        required: false
        type: string
        default: ''
      runner_x86_64:
        description: 'Runner label for the x86_64 leg. This IS the glibc baseline — see the header.'
        required: false
        type: string
        default: 'ubuntu-24.04'
      runner_aarch64:
        description: 'Runner label for the aarch64 leg (GitHub-hosted ARM runners are free on public repos).'
        required: false
        type: string
        default: 'ubuntu-24.04-arm'
    secrets:
      RELEASES_TOKEN:
        description: >-
          Fine-grained PAT with Contents:RW on releases_repo. Required when
          releases_repo is set (the default GITHUB_TOKEN cannot write
          cross-repo); ignored otherwise.
        required: false
      LINUX_GPG_PRIVATE_KEY:
        description: >-
          ASCII-armored private key (or its base64) that signs the AppImage
          (embedded, via appimagetool), the RPM (rpmsign) and SHA256SUMS
          (detached .asc). Unset = unsigned artifacts.
        required: false
      LINUX_GPG_PASSPHRASE:
        description: 'Passphrase for LINUX_GPG_PRIVATE_KEY. REQUIRED in CI when the key has one — gpg would otherwise block on a TTY prompt that never comes.'
        required: false
      LINUX_GPG_KEY_ID:
        description: 'Key ID/fingerprint to sign with. Defaults to the first secret key in the imported keyring.'
        required: false

# Every job below declares what it needs. In a reusable workflow the caller's
# grant is the ceiling, so the caller must grant contents: write, id-token:
# write and attestations: write (templates/release.yml does). The last two
# are used only by the attest job, but GitHub checks them for the whole
# called workflow: a caller that grants only contents: write fails before
# any job starts.
permissions:
  contents: read

jobs:
  # Fail fast on a cheap runner: no CHANGELOG entry for the tag, or a missing
  # cross-repo token, means no matrix spin-up.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolved.outputs.VERSION }}
      bare: ${{ steps.resolved.outputs.BARE }}
      prerelease: ${{ steps.resolved.outputs.PRERELEASE }}
      releases_owner: ${{ steps.relrepo.outputs.OWNER }}
      releases_name: ${{ steps.relrepo.outputs.NAME }}
      signing: ${{ steps.signing.outputs.SIGNING }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
      RELEASES_REPO: ${{ inputs.releases_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch retry names the tag; without this it would build whatever the
          # default branch is at retry time and attach that beside the tag's assets.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: resolved
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid semver tag (expected vX.Y.Z[-suffix])"
            exit 1
          fi
          BARE="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BARE=$BARE" >> "$GITHUB_OUTPUT"
          # Any semver suffix marks a GitHub prerelease; there are no update
          # channels to derive here, that is a store's job.
          case "$BARE" in
            *-*) echo "PRERELEASE=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Resolve releases repo
        id: relrepo
        run: |
          REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          echo "OWNER=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "NAME=${REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Preflight - RELEASES_TOKEN present when cross-repo
        if: inputs.releases_repo != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "${RELEASES_TOKEN:-}" ]; then
            echo "::error::releases_repo is set but the RELEASES_TOKEN secret is missing — create a fine-grained PAT with Contents:RW on ${RELEASES_REPO}"
            exit 1
          fi
          echo "RELEASES_TOKEN present."

      # Secrets are invisible to `if:` expressions in later jobs, so the
      # signing decision is taken once here and passed around as an output.
      - name: Detect signing configuration
        id: signing
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "SIGNING=true" >> "$GITHUB_OUTPUT"
          else
            echo "SIGNING=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LINUX_GPG_PRIVATE_KEY — this release ships unsigned artifacts (checksums only)."
          fi

      # Checked here, before any build: an updater pointed at a repo that does
      # not serve the assets never finds an update, and nothing would ever
      # say so — installed AppImages just stay on this version.
      - name: Preflight - AppImage update information
        if: inputs.appimage_update_info != ''
        env:
          UPDATE_INFO: ${{ inputs.appimage_update_info }}
          REL_OWNER: ${{ steps.relrepo.outputs.OWNER }}
          REL_NAME: ${{ steps.relrepo.outputs.NAME }}
        run: |
          set -euo pipefail
          IFS='|' read -r KIND OWNER NAME _ <<<"$UPDATE_INFO"
          case "$KIND" in
            gh-releases-zsync)
              want="$(printf '%s/%s' "$REL_OWNER" "$REL_NAME" | tr '[:upper:]' '[:lower:]')"
              got="$(printf '%s/%s' "$OWNER" "$NAME" | tr '[:upper:]' '[:lower:]')"
              if [ "$got" != "$want" ]; then
                echo "::error::appimage_update_info points the updater at ${OWNER}/${NAME}, but the release assets (and the .zsync) are served from ${REL_OWNER}/${REL_NAME}"
                exit 1
              fi
              ;;
            zsync|pling-v1-zsync) echo "::notice::appimage_update_info is a ${KIND} string — make sure it resolves to the .zsync this release uploads." ;;
            *)
              echo "::error::appimage_update_info must start with 'gh-releases-zsync|', 'zsync|' or 'pling-v1-zsync|' (the forms appimagetool accepts), got '${KIND}|…'"
              exit 1
              ;;
          esac

      - name: Verify CHANGELOG entry exists
        env:
          VERSION: ${{ steps.resolved.outputs.VERSION }}
          BARE: ${{ steps.resolved.outputs.BARE }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not present — its ${VERSION} section is the release body. Add one before tagging."
            exit 1
          fi
          # The same heading shape the release-body extractor in create-release reads
          # (`## [X.Y.Z]`): a looser guard passed headings the extractor cannot find,
          # and the release then shipped with a placeholder body.
          if ! grep -E "^## \[(${VERSION}|${BARE})\]" CHANGELOG.md >/dev/null; then
            echo "::error::CHANGELOG.md has no '## [${BARE}]' heading. Add one before tagging."
            exit 1
          fi
          echo "Found CHANGELOG entry for ${VERSION}."

  # Resolve which legs the app ships (`targets`) and which THIS run builds
  # (`build_targets`). Splitting the two is what makes a failed release
  # resumable.
  plan:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.MATRIX }}
      targets: ${{ steps.plan.outputs.TARGETS }}
      formats: ${{ steps.plan.outputs.FORMATS }}
    env:
      TARGETS: ${{ inputs.targets }}
      BUILD_TARGETS: ${{ inputs.build_targets }}
      FORMATS: ${{ inputs.formats }}
      RUNNER_X86_64: ${{ inputs.runner_x86_64 }}
      RUNNER_AARCH64: ${{ inputs.runner_aarch64 }}
    steps:
      - name: Compute build matrix
        id: plan
        run: |
          set -euo pipefail
          # One leg per platform key. Each leg builds NATIVELY on its own
          # architecture: linuxdeploy cannot cross-build AppImages, and a
          # native build sidesteps the whole cross-sysroot/pkg-config dance.
          LEGS=$(jq -cn --arg x "$RUNNER_X86_64" --arg a "$RUNNER_AARCH64" '{
            "linux-x86_64":  {"runner":$x,"target":"x86_64-unknown-linux-gnu", "arch":"x86_64", "deb_arch":"amd64","rpm_arch":"x86_64"},
            "linux-aarch64": {"runner":$a,"target":"aarch64-unknown-linux-gnu","arch":"aarch64","deb_arch":"arm64","rpm_arch":"aarch64"}
          }')
          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr ',' '\n' | sed '/^$/d' | awk '!seen[$0]++'; }
          TARGET_LIST=$(norm "$TARGETS")
          [ -n "$TARGET_LIST" ] || { echo "::error::targets input resolved to an empty set"; exit 1; }
          BUILD_LIST=$(norm "${BUILD_TARGETS:-}")
          [ -n "$BUILD_LIST" ] || BUILD_LIST="$TARGET_LIST"
          for t in $TARGET_LIST; do
            printf '%s' "$LEGS" | jq -e --arg t "$t" 'has($t)' >/dev/null \
              || { echo "::error::Unknown target '$t' in targets input (allowed: linux-x86_64, linux-aarch64)"; exit 1; }
          done
          for t in $BUILD_LIST; do
            printf '%s\n' "$TARGET_LIST" | grep -qx -- "$t" \
              || { echo "::error::build_targets entry '$t' is not in this app's targets set"; exit 1; }
          done
          FORMAT_LIST=$(norm "$FORMATS")
          [ -n "$FORMAT_LIST" ] || { echo "::error::formats input resolved to an empty set"; exit 1; }
          for f in $FORMAT_LIST; do
            printf '%s\n' deb rpm appimage arch | grep -qx -- "$f" \
              || { echo "::error::Unknown format '$f' (allowed: deb, rpm, appimage, arch)"; exit 1; }
          done
          FORMATS_CSV=$(printf '%s\n' "$FORMAT_LIST" | paste -sd, -)
          MATRIX=$(printf '%s\n' "$BUILD_LIST" | jq -cRn --argjson legs "$LEGS" --arg fm "$FORMATS_CSV" \
            '{include: [inputs | $legs[.] + {formats: $fm}]}')
          {
            echo "MATRIX=$MATRIX"
            echo "TARGETS=$(printf '%s\n' "$TARGET_LIST" | paste -sd, -)"
            echo "FORMATS=$FORMATS_CSV"
          } >> "$GITHUB_OUTPUT"
          echo "Building: $(printf '%s\n' "$BUILD_LIST" | paste -sd, -) (shipping set: $(printf '%s\n' "$TARGET_LIST" | paste -sd, -)); formats: $FORMATS_CSV"

  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch retry names the tag; without this it would build whatever the
          # default branch is at retry time and attach that beside the tag's assets.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # The release body IS the tag's CHANGELOG section — it is what users read
      # on the release page and what the stores' "what's new" pulls from.
      - name: Extract changelog section for release body
        id: notes
        env:
          BARE: ${{ needs.preflight.outputs.bare }}
        run: |
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$BARE" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > "$BODY_FILE"
          fi
          if [ ! -s "${BODY_FILE:-/dev/null}" ]; then
            echo "No CHANGELOG section found for $BARE — using fallback body" >&2
            printf 'See the changelog in the repository for details on this release.\n' > "$BODY_FILE"
          fi
          echo "file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      # FIND-or-create: a retry dispatch for the same tag must land on the
      # SAME draft so the other leg's assets are kept. Drafts are invisible to
      # getReleaseByTag, so scan the list. A PUBLISHED release for the tag is
      # a hard error — never silently overwrite what users already downloaded.
      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          APP_NAME: ${{ inputs.app_display_name }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        with:
          github-token: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs');
            const { VERSION, PRERELEASE, APP_NAME, REL_OWNER, REL_NAME, NOTES_FILE } = process.env;
            const body = readFileSync(NOTES_FILE, 'utf8').trim();
            const prerelease = PRERELEASE === 'true';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: REL_OWNER, repo: REL_NAME, per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === VERSION);
            if (existing && !existing.draft) {
              core.setFailed(`A published release for ${VERSION} already exists on ${REL_OWNER}/${REL_NAME} — bump the version (or delete that release) instead of re-releasing the tag.`);
              return;
            }
            if (existing) {
              core.info(`Reusing draft release ${existing.id} for ${VERSION} (retry run) — refreshing title/notes.`);
              await github.rest.repos.updateRelease({
                owner: REL_OWNER, repo: REL_NAME, release_id: existing.id,
                tag_name: VERSION, name: `${APP_NAME} ${VERSION}`, body,
                draft: true, prerelease,
              });
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: REL_OWNER, repo: REL_NAME, tag_name: VERSION,
              name: `${APP_NAME} ${VERSION}`, body, draft: true, prerelease,
            });
            return data.id;

  build:
    needs: [preflight, plan, create-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Native builds of large apps (and the first, uncached aarch64 leg) are slow;
    # this only caps GitHub's 6-hour default.
    permissions:
      contents: write
    env:
      # Exported for build_command, binary_path and nfpm.yaml alike. nfpm
      # expands ${VAR} in its config, so one variable set serves both.
      RK_TARGET: ${{ matrix.target }}
      RK_ARCH: ${{ matrix.arch }}
      RK_DEB_ARCH: ${{ matrix.deb_arch }}
      RK_RPM_ARCH: ${{ matrix.rpm_arch }}
      RK_VERSION: ${{ needs.preflight.outputs.bare }}
      RK_TAG: ${{ needs.preflight.outputs.version }}
      RK_PRODUCT: ${{ inputs.product_name }}
      RK_BINARY: ${{ inputs.binary_name != '' && inputs.binary_name || inputs.product_name }}
      FORMATS: ${{ matrix.formats }}
      DIST: ${{ github.workspace }}/.release-kit/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch retry names the tag; without this it would build whatever the
          # default branch is at retry time and attach that beside the tag's assets.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Plain apt-get, NOT a caching action: on a real release's arm64 leg a
      # cache action reported "installing 12 packages... done" while
      # installing ZERO, and the build died ten minutes later. A release must
      # fail loudly at the install step.
      #   libfuse2t64 — linuxdeploy is itself an AppImage and needs FUSE2 to
      #     run; 24.04 renamed libfuse2 for the 64-bit time_t transition.
      #     The libfuse2 fallback serves a caller that pins a 22.04 runner.
      #   rpm — rpmsign + signature verification; nfpm writes RPMs itself
      #   gettext-base — envsubst for binary_path
      #   desktop-file-utils — validates the .desktop before it ships
      #   file — asserts the binary is really the leg's architecture
      #   zstd — lets tar inspect the Arch .pkg.tar.zst after nfpm writes it
      - name: Install packaging dependencies
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # Unquoted on purpose: apt_packages is a space-separated list.
          # shellcheck disable=SC2086
          sudo apt-get install -y rpm gettext-base desktop-file-utils file zstd $APT_PACKAGES
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        if: inputs.rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Rust workspace
        if: inputs.rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.rust_workspace_dir }}
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      # Gates before the expensive part, same reasoning as the sibling kits:
      # a lint failure should cost seconds, not a build.
      - name: Rust format + clippy gates
        if: inputs.rust && inputs.rust_gates
        working-directory: ${{ inputs.rust_workspace_dir }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --locked --target "$RK_TARGET" -- -D warnings

      # Linux artifact signing. One GPG key signs the AppImage (embedded, via
      # appimagetool's SIGN env), the RPM (rpmsign) and — in the checksums job
      # — SHA256SUMS. The .deb stays unsigned: apt verifies repository
      # metadata, not packages, and a standalone .deb has no signature check
      # to satisfy.
      - name: Import Linux signing key
        id: linux_sign
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY_FILE="${RUNNER_TEMP}/linux-signing.asc"
          # Accept the armored key directly or base64-wrapped (people reach for
          # base64 even though the secrets UI preserves the armor).
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          elif printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode 2>/dev/null | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          else
            echo "::error::LINUX_GPG_PRIVATE_KEY is neither an ASCII-armored private key nor base64 of one. Export it with 'gpg --armor --export-secret-keys <KEY_ID>'."
            exit 1
          fi
          chmod 600 "$KEY_FILE"

          # Loopback pinentry: without it gpg blocks forever on a passphrase
          # dialog no CI runner can answer. Preset-passphrase lets rpmsign —
          # which drives gpg itself and offers no --passphrase — sign too.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --passphrase "$LINUX_GPG_PASSPHRASE" --import "$KEY_FILE"
          else
            gpg --batch --yes --import "$KEY_FILE"
          fi
          rm -f "$KEY_FILE"

          KEY_ID="${LINUX_GPG_KEY_ID:-}"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          fi
          if [ -z "$KEY_ID" ]; then
            echo "::error::No secret key present after import — the key material did not load"
            exit 1
          fi
          # Ultimate ownertrust, or gpg refuses to sign non-interactively.
          printf '%s:6:\n' "$KEY_ID" | gpg --batch --import-ownertrust

          if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
            for grip in $(gpg --batch --with-colons --with-keygrip --list-secret-keys "$KEY_ID" | awk -F: '/^grp:/ { print $10 }'); do
              /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$LINUX_GPG_PASSPHRASE" "$grip"
            done
          fi

          # Prove the key can sign NOW, before anything is built: a wrong
          # passphrase or a sign-incapable subkey must not surface as a
          # cryptic appimagetool failure after the compile.
          if ! printf 'probe' | gpg --batch --yes -u "$KEY_ID" --armor --detach-sign > /dev/null; then
            echo "::error::The imported key ${KEY_ID} cannot sign — wrong LINUX_GPG_PASSPHRASE, or the key has no signing capability"
            exit 1
          fi

          {
            echo "SIGN=1"
            echo "SIGN_KEY=${KEY_ID}"
            if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
              echo "APPIMAGETOOL_SIGN_PASSPHRASE=${LINUX_GPG_PASSPHRASE}"
            fi
          } >> "$GITHUB_ENV"
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "Linux signing key ${KEY_ID} imported (AppImage + RPM + SHA256SUMS)."

      # Same directory as the fmt/clippy gates and the cargo cache: a nested
      # workspace that passed the gates used to fail here with "could not find
      # Cargo.toml" because the build ran at the repo root.
      - name: Build
        working-directory: ${{ inputs.rust_workspace_dir }}
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          echo "Building ${RK_PRODUCT} ${RK_VERSION} for ${RK_TARGET}"
          bash -euo pipefail -c "$BUILD_COMMAND"

      # Three assertions that each catch a real class of silent failure: the
      # path is wrong (build_command wrote somewhere else), the file is not
      # executable (a script left it 644), or it is the WRONG architecture
      # (a cargo invocation that ignored --target builds for the host, which
      # only differs from the leg when someone later cross-builds).
      - name: Locate the built binary
        id: binary
        working-directory: ${{ inputs.rust_workspace_dir }}
        env:
          BINARY_PATH: ${{ inputs.binary_path }}
        run: |
          set -euo pipefail
          BIN=$(printf '%s' "$BINARY_PATH" | envsubst)
          if [ ! -f "$BIN" ]; then
            echo "::error::No binary at '${BIN}' (from binary_path='${BINARY_PATH}', relative to rust_workspace_dir) after build_command ran"
            exit 1
          fi
          # Every later step runs at the repo root, so hand them an absolute path.
          BIN=$(readlink -f "$BIN")
          [ -x "$BIN" ] || chmod +x "$BIN"
          DESC=$(file -b "$BIN")
          case "$RK_ARCH" in
            x86_64)  printf '%s' "$DESC" | grep -q 'x86-64' ;;
            aarch64) printf '%s' "$DESC" | grep -qi 'aarch64' ;;
          esac || {
            echo "::error::${BIN} is not a ${RK_ARCH} ELF binary: ${DESC}"
            exit 1
          }
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "RK_BINARY_PATH=$BIN" >> "$GITHUB_ENV"
          mkdir -p "$DIST"
          echo "${DESC}"

      - name: Resolve packaging assets
        id: assets
        env:
          DESKTOP_FILE: ${{ inputs.desktop_file }}
          ICON: ${{ inputs.icon }}
          METAINFO: ${{ inputs.metainfo }}
          NFPM_CONFIG: ${{ inputs.nfpm_config }}
        run: |
          set -euo pipefail
          DESKTOP="${DESKTOP_FILE:-packaging/linux/${RK_PRODUCT}.desktop}"
          ICON_PATH="${ICON:-packaging/linux/${RK_PRODUCT}.png}"
          case ",$FORMATS," in
            *,appimage,*)
              [ -f "$DESKTOP" ]   || { echo "::error::AppImage needs a .desktop file; none at '${DESKTOP}' (desktop_file input)"; exit 1; }
              [ -f "$ICON_PATH" ] || { echo "::error::AppImage needs a PNG icon; none at '${ICON_PATH}' (icon input)"; exit 1; }
              # A broken desktop file makes linuxdeploy fail late and
              # cryptically; validate it here where the message is readable.
              desktop-file-validate "$DESKTOP"
              ICON_KEY=$(sed -n 's/^Icon=//p' "$DESKTOP" | head -1)
              ICON_BASE=$(basename "$ICON_PATH" .png)
              if [ "$ICON_KEY" != "$ICON_BASE" ]; then
                echo "::error::The desktop file's Icon=${ICON_KEY} does not match the icon file name '${ICON_BASE}' — linuxdeploy requires them to agree"
                exit 1
              fi
              ;;
          esac
          case ",$FORMATS," in
            *,deb,*|*,rpm,*|*,arch,*)
              [ -f "$NFPM_CONFIG" ] || { echo "::error::deb/rpm/arch need an nfpm config; none at '${NFPM_CONFIG}' (nfpm_config input). Start from templates/nfpm.yaml."; exit 1; }
              ;;
          esac
          if [ -n "${METAINFO:-}" ] && [ ! -f "$METAINFO" ]; then
            echo "::error::metainfo input points at '${METAINFO}', which does not exist"
            exit 1
          fi
          {
            echo "desktop=$DESKTOP"
            echo "icon=$ICON_PATH"
            echo "metainfo=${METAINFO:-}"
            echo "nfpm=$NFPM_CONFIG"
          } >> "$GITHUB_OUTPUT"

      # nfpm writes deb AND rpm AND the Arch package from one config, with
      # per-packager overrides for the names that differ (a Fedora `Requires:`
      # is not a Debian `Depends:`). Installed from its GitHub release for the
      # leg's architecture — the apt repo lags and `go install` needs a
      # toolchain.
      - name: Install nfpm
        if: contains(matrix.formats, 'deb') || contains(matrix.formats, 'rpm') || contains(matrix.formats, 'arch')
        env:
          GH_TOKEN: ${{ github.token }}
          NFPM_VERSION: ${{ inputs.nfpm_version }}
        run: |
          set -euo pipefail
          gh release download ${NFPM_VERSION:+"$NFPM_VERSION"} --repo goreleaser/nfpm \
            --pattern "nfpm_*_${RK_DEB_ARCH}.deb" --dir "$RUNNER_TEMP" --clobber
          sudo dpkg -i "$RUNNER_TEMP"/nfpm_*_"${RK_DEB_ARCH}".deb
          nfpm --version

      - name: Package .deb
        if: contains(matrix.formats, 'deb')
        env:
          NFPM_CONFIG: ${{ steps.assets.outputs.nfpm }}
        run: |
          set -euo pipefail
          OUT="${DIST}/${RK_PRODUCT}_${RK_VERSION}_${RK_DEB_ARCH}.deb"
          nfpm package --config "$NFPM_CONFIG" --packager deb --target "$OUT"
          echo "--- $(basename "$OUT") ---"
          dpkg-deb --info "$OUT"
          # Listed once into a variable, and every check below matches against
          # that rather than piping into `grep -q`. `grep -q` exits at the
          # first match; dpkg-deb then takes SIGPIPE writing the rest of the
          # listing, and `pipefail` reports the whole pipeline as failed — so
          # a package that DOES contain the path fails the check looking for
          # it, and only once the listing is long enough for the race to land.
          CONTENTS="$(dpkg-deb --contents "$OUT")"
          printf '%s\n' "$CONTENTS"
          # The Flatpak/AUR/Snap workflows repack this file and need an
          # executable under usr/bin plus a .desktop entry; fail here rather
          # than in three downstream jobs.
          grep -qE ' \./usr/bin/[^/ ]+$' <<<"$CONTENTS" \
            || { echo "::error::The .deb installs nothing under /usr/bin — check the contents: block of ${NFPM_CONFIG}"; exit 1; }
          grep -q '/usr/share/applications/.*\.desktop$' <<<"$CONTENTS" \
            || echo "::warning::The .deb ships no .desktop file — the app will not appear in launchers, and the Flatpak/Snap repacks will fail"
          # System caches must never ship in a package: every package would
          # carry its own copy of the same path and they conflict on install.
          # They sneak in when a staging install runs update-desktop-database
          # or gtk-update-icon-cache against the package root.
          if grep -qE '/(icon-theme\.cache|mimeinfo\.cache)$' <<<"$CONTENTS"; then
            echo "::error::The .deb ships icon-theme.cache/mimeinfo.cache — guard the staging install's cache refreshers on its package-root variable"
            exit 1
          fi

      - name: Package .rpm
        if: contains(matrix.formats, 'rpm')
        env:
          NFPM_CONFIG: ${{ steps.assets.outputs.nfpm }}
          SIGNING: ${{ steps.linux_sign.outputs.signing }}
          KEY_ID: ${{ steps.linux_sign.outputs.key_id }}
        run: |
          set -euo pipefail
          # RPM forbids '-' in Version; nfpm writes a semver prerelease as
          # Version: 1.0.0~beta.1, which RPM sorts before 1.0.0. The FILENAME
          # cannot carry the '~': GitHub stores it as '.', so an asset named
          # with it is not found under its own name. The filename uses '.'
          # from the start; the header keeps the tilde.
          RPM_VERSION="${RK_VERSION//-/.}"
          OUT="${DIST}/${RK_PRODUCT}-${RPM_VERSION}-1.${RK_RPM_ARCH}.rpm"
          nfpm package --config "$NFPM_CONFIG" --packager rpm --target "$OUT"
          if [ "$SIGNING" = "true" ]; then
            rpmsign --define "_gpg_name ${KEY_ID}" --addsign "$OUT"
            gpg --armor --export "$KEY_ID" > "${RUNNER_TEMP}/RPM-GPG-KEY"
            # One explicit keyring database for the import and the check. The
            # key used to go in with `sudo rpm --import` and the check ran as
            # the runner user, and Debian's rpm keeps a per-user database by
            # default — so the check never saw the key and every signed
            # package failed as "digests SIGNATURES NOT OK".
            RPMDB="${RUNNER_TEMP}/rpmdb"
            mkdir -p "$RPMDB"
            rpmkeys --dbpath "$RPMDB" --import "${RUNNER_TEMP}/RPM-GPG-KEY"
            # We ran rpmsign ourselves, so a signature that does not verify
            # against our own key is a pipeline bug — hard error.
            CHECK="$(rpm --dbpath "$RPMDB" -Kv "$OUT" 2>&1 || true)"
            if ! rpm --dbpath "$RPMDB" -K "$OUT" | grep -qi 'signatures OK'; then
              echo "::error::$(basename "$OUT") did not verify against ${KEY_ID}"
              printf '%s\n' "$CHECK"
              exit 1
            fi
            echo "RPM signed + verified against ${KEY_ID}."
          fi
          echo "--- $(basename "$OUT") ---"
          rpm -qip "$OUT"
          rpm -qlp "$OUT"

      # Native pacman package via nfpm's archlinux packager. Two version
      # quirks this step compensates for (both verified against nfpm 2.47 and
      # pacman's vercmp):
      #   - nfpm silently DROPS a semver prerelease for this packager: fed
      #     1.2.3-beta.1 it writes pkgver = 1.2.3, so a beta would masquerade
      #     as the stable release. The version is therefore mapped to the
      #     Arch form BEFORE nfpm sees it.
      #   - Arch forbids '-' in pkgver, and the underscore form people reach
      #     for sorts the WRONG way: vercmp puts 1.2.3_beta.1 AFTER 1.2.3.
      #     Deleting the hyphens instead (1.2.3beta.1) sorts before the
      #     stable release, and alpha < beta < rc orders alphabetically.
      # The signature is pacman's native detached .sig uploaded next to the
      # package: repo-add folds it into the repo database, and pacman fetches
      # it whenever the user's SigLevel asks for one.
      - name: Package Arch (.pkg.tar.zst)
        if: contains(matrix.formats, 'arch')
        env:
          NFPM_CONFIG: ${{ steps.assets.outputs.nfpm }}
          SIGNING: ${{ steps.linux_sign.outputs.signing }}
          KEY_ID: ${{ steps.linux_sign.outputs.key_id }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ARCH_PKGVER="${RK_VERSION//-/}"
          OUT="${DIST}/${RK_PRODUCT}-${ARCH_PKGVER}-1-${RK_ARCH}.pkg.tar.zst"
          RK_VERSION="$ARCH_PKGVER" nfpm package --config "$NFPM_CONFIG" --packager archlinux --target "$OUT"
          echo "--- $(basename "$OUT") ---"
          # Same SIGPIPE-under-pipefail reason as the .deb step: list once,
          # match against the variable.
          CONTENTS="$(tar -tf "$OUT")"
          printf '%s\n' "$CONTENTS"
          # Same downstream contract as the .deb: an executable under
          # /usr/bin, checked here rather than in the pacman-repo workflow.
          grep -qE '^usr/bin/[^/]+$' <<<"$CONTENTS" \
            || { echo "::error::The Arch package installs nothing under /usr/bin — check the contents: block of ${NFPM_CONFIG}"; exit 1; }
          # Same cache guard as the .deb step: shipped system caches conflict
          # between packages at install time.
          if grep -qE '/(icon-theme\.cache|mimeinfo\.cache)$' <<<"$CONTENTS"; then
            echo "::error::The Arch package ships icon-theme.cache/mimeinfo.cache — guard the staging install's cache refreshers on its package-root variable"
            exit 1
          fi
          # Prove the prerelease mapping survived nfpm — this is the check
          # that catches a future nfpm changing its version handling.
          PKGVER_IN=$(tar -xOf "$OUT" .PKGINFO | sed -n 's/^pkgver = //p')
          [ "$PKGVER_IN" = "${ARCH_PKGVER}-1" ] \
            || { echo "::error::.PKGINFO carries pkgver '${PKGVER_IN}', expected '${ARCH_PKGVER}-1' — nfpm's archlinux version handling changed"; exit 1; }
          if [ "$SIGNING" = "true" ]; then
            gpg --batch --yes -u "$KEY_ID" ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} \
              --output "${OUT}.sig" --detach-sign "$OUT"
            gpg --verify "${OUT}.sig" "$OUT"
            echo "Arch package signed + verified against ${KEY_ID}."
          fi

      # linuxdeploy assembles the AppDir (binary, .desktop, icon, AppRun) and
      # bundles every shared library the binary links except the blacklisted
      # base-system set (glibc, libGL, …) — which is exactly why the runner
      # baseline matters: the glibc the AppImage expects is the runner's.
      - name: Package AppImage
        if: contains(matrix.formats, 'appimage')
        env:
          GH_TOKEN: ${{ github.token }}
          BIN: ${{ steps.binary.outputs.path }}
          DESKTOP: ${{ steps.assets.outputs.desktop }}
          ICON: ${{ steps.assets.outputs.icon }}
          METAINFO: ${{ steps.assets.outputs.metainfo }}
          EXTRA_ARGS: ${{ inputs.appimage_extra_args }}
          UPDATE_INFO_TEMPLATE: ${{ inputs.appimage_update_info }}
          SIGNING: ${{ steps.linux_sign.outputs.signing }}
          KEY_ID: ${{ steps.linux_sign.outputs.key_id }}
          # linuxdeploy's strip pass breaks against newer binutils (seen on
          # the ubuntu-24.04 images: "failed to run linuxdeploy" with FUSE
          # installed). The binary is already stripped by the release profile;
          # leaving bundled libs unstripped costs a few MB and nothing else.
          NO_STRIP: 'true'
          # linuxdeploy is pinned to a dated release and checked against a
          # sha256, not taken from the moving `continuous` tag: that tag is
          # rebuilt in place, so an unpinned download changed the AppImage
          # toolchain between two runs of the same release with no trace.
          # The linuxdeploy AppImage bundles linuxdeploy-plugin-appimage and
          # appimagetool, so this one pin covers the whole toolchain; nothing
          # else is downloaded.
          # To bump: pick a dated tag from
          # https://github.com/linuxdeploy/linuxdeploy/releases, then for each
          # arch run `curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/<tag>/linuxdeploy-<arch>.AppImage | sha256sum`
          # and paste the tag and both hashes below (the release page's
          # "sha256:" digest must agree).
          LINUXDEPLOY_TAG: '1-alpha-20251107-1'
          LINUXDEPLOY_SHA256_X86_64: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
          LINUXDEPLOY_SHA256_AARCH64: '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff'
        run: |
          set -euo pipefail
          TOOLS="${RUNNER_TEMP}/linuxdeploy"
          mkdir -p "$TOOLS"
          case "$RK_ARCH" in
            x86_64)  LINUXDEPLOY_SHA256="$LINUXDEPLOY_SHA256_X86_64" ;;
            aarch64) LINUXDEPLOY_SHA256="$LINUXDEPLOY_SHA256_AARCH64" ;;
            *) echo "::error::No pinned linuxdeploy checksum for ${RK_ARCH}"; exit 1 ;;
          esac
          gh release download "$LINUXDEPLOY_TAG" --repo linuxdeploy/linuxdeploy \
            --pattern "linuxdeploy-${RK_ARCH}.AppImage" --dir "$TOOLS" --clobber
          ( cd "$TOOLS" && printf '%s  %s\n' "$LINUXDEPLOY_SHA256" "linuxdeploy-${RK_ARCH}.AppImage" | sha256sum -c - ) \
            || { echo "::error::linuxdeploy-${RK_ARCH}.AppImage from ${LINUXDEPLOY_TAG} does not match its pinned sha256 — the release asset changed; re-verify before bumping the pin"; exit 1; }
          chmod +x "${TOOLS}/linuxdeploy-${RK_ARCH}.AppImage"

          APPDIR="${RUNNER_TEMP}/AppDir"
          rm -rf "$APPDIR"
          if [ -n "${METAINFO:-}" ]; then
            install -Dm644 "$METAINFO" "${APPDIR}/usr/share/metainfo/$(basename "$METAINFO")"
          fi

          # `VERSION` names the output; ARCH tells appimagetool what it is
          # building when it cannot infer it. OUTPUT pins the filename to the
          # scheme every downstream workflow expects.
          export VERSION="$RK_VERSION" ARCH="$RK_ARCH"
          export OUTPUT="${DIST}/${RK_PRODUCT}_${RK_VERSION}_${RK_ARCH}.AppImage"

          # AppImage self-update (appimage_update_info). The pinned appimage
          # plugin reads LDAI_UPDATE_INFORMATION (UPDATE_INFORMATION is its
          # deprecated alias) and hands it to appimagetool as `-u`, which
          # embeds it and — only when zsyncmake is on PATH, hence the zsync
          # package — writes the .zsync the updater fetches. zsyncmake names
          # it after the AppImage's basename and writes it to the CURRENT
          # directory, not next to OUTPUT; it is moved into DIST below.
          UPDATE_INFO=""
          if [ -n "${UPDATE_INFO_TEMPLATE:-}" ]; then
            UPDATE_INFO="$(printf '%s' "$UPDATE_INFO_TEMPLATE" | envsubst)"
            ZSYNC_NAME="$(basename "$OUTPUT").zsync"
            if [ "${UPDATE_INFO%%|*}" = "gh-releases-zsync" ]; then
              # The updater picks the .zsync from the latest release by this
              # glob; one that does not match this leg's file never updates.
              PATTERN="${UPDATE_INFO##*|}"
              # shellcheck disable=SC2053 # PATTERN is a glob on purpose
              [[ "$ZSYNC_NAME" == $PATTERN ]] \
                || { echo "::error::appimage_update_info's file pattern '${PATTERN}' does not match this leg's ${ZSYNC_NAME} — use <product>_*_\$RK_ARCH.AppImage.zsync"; exit 1; }
            fi
            sudo apt-get install -y zsync
            rm -f "$ZSYNC_NAME" "${OUTPUT}.zsync"
            export LDAI_UPDATE_INFORMATION="$UPDATE_INFO"
          fi

          # shellcheck disable=SC2086
          "${TOOLS}/linuxdeploy-${RK_ARCH}.AppImage" \
            --appdir "$APPDIR" \
            --executable "$BIN" \
            --desktop-file "$DESKTOP" \
            --icon-file "$ICON" \
            $EXTRA_ARGS \
            --output appimage
          [ -f "$OUTPUT" ] || { echo "::error::linuxdeploy exited 0 but ${OUTPUT} does not exist"; exit 1; }
          chmod +x "$OUTPUT"
          ls -lh "$OUTPUT"

          if [ -n "$UPDATE_INFO" ]; then
            [ ! -f "$ZSYNC_NAME" ] || mv "$ZSYNC_NAME" "${OUTPUT}.zsync"
            [ -f "${OUTPUT}.zsync" ] \
              || { echo "::error::appimage_update_info is set but appimagetool wrote no ${ZSYNC_NAME} — installed AppImages would find no update"; exit 1; }
            EMBEDDED="$("$OUTPUT" --appimage-updateinformation)"
            if [ "$EMBEDDED" != "$UPDATE_INFO" ]; then
              echo "::error::$(basename "$OUTPUT") embeds update information '${EMBEDDED}', expected '${UPDATE_INFO}'"
              exit 1
            fi
            echo "Embedded update information: ${EMBEDDED} (+ ${ZSYNC_NAME})"
          fi

          if [ "$SIGNING" = "true" ]; then
            # appimagetool already aborts the build when signing fails ("Signing
            # failed, aborting"); this catches signing that "succeeded" against nothing.
            # Advisory: AppImage never validates its own signature at run time.
            if "$OUTPUT" --appimage-signature 2>/dev/null | grep -q 'PGP SIGNATURE'; then
              echo "AppImage carries an embedded signature (key ${KEY_ID})."
            else
              echo "::warning::$(basename "$OUTPUT") has no readable embedded signature. Publish the key fingerprint ${KEY_ID} over TLS so users can check it with the AppImage validate tool."
            fi
          fi

      # Opt-in (smoke_test: true). Every check above reads package METADATA;
      # this one runs what users download, on the leg's own architecture and
      # before anything is uploaded — a startup panic or an unresolvable
      # library otherwise ships and is found by users.
      #   .deb:     the Version field carries the tag (catches an nfpm.yaml
      #             with a hard-coded version), `apt-get install` resolves
      #             every declared Depends name against the baseline distro,
      #             and `ldd` finds every library the installed binaries link.
      #             The build's own -dev packages are on this runner, so ldd
      #             cannot catch a library missing from Depends — only a
      #             clean machine can.
      #   AppImage: extracted and launched under Xvfb; it must still be
      #             running when `timeout` kills it (exit 124), and its output
      #             must carry no panic or dynamic-loader error.
      - name: Smoke-test the packages
        if: inputs.smoke_test
        env:
          SMOKE_ARGS: ${{ inputs.smoke_args }}
        run: |
          set -euo pipefail
          case ",$FORMATS," in
            *,deb,*)
              DEB="${DIST}/${RK_PRODUCT}_${RK_VERSION}_${RK_DEB_ARCH}.deb"
              # nfpm writes <version>[~<prerelease>]-<release>, optionally
              # behind an epoch: compare everything before the release.
              EXPECTED="${RK_VERSION/-/\~}"
              DEB_VERSION="$(dpkg-deb -f "$DEB" Version)"
              case "${DEB_VERSION#*:}" in
                "$EXPECTED"|"$EXPECTED"-*) echo "$(basename "$DEB"): Version ${DEB_VERSION}" ;;
                *) echo "::error::$(basename "$DEB") carries Version '${DEB_VERSION}', expected ${EXPECTED}[-<release>] — does nfpm.yaml use version: \${RK_VERSION}?"; exit 1 ;;
              esac
              PKG="$(dpkg-deb -f "$DEB" Package)"
              sudo apt-get install -y "$DEB"
              UNRESOLVED=""
              while read -r BIN_FILE; do
                # ldd exits non-zero on a static binary; that is not a failure.
                LDD="$(ldd "$BIN_FILE" 2>&1 || true)"
                if grep -q 'not found' <<<"$LDD"; then
                  UNRESOLVED="${UNRESOLVED}${BIN_FILE}:"$'\n'"$(grep 'not found' <<<"$LDD")"$'\n'
                fi
              done < <(dpkg -L "$PKG" | grep -E '^/usr/bin/[^/]+$')
              sudo apt-get remove -y "$PKG"
              if [ -n "$UNRESOLVED" ]; then
                echo "::error::The installed .deb links libraries that do not resolve:"
                printf '%s' "$UNRESOLVED"
                exit 1
              fi
              echo "Installed ${PKG} and resolved every linked library."
              ;;
            *) echo "::notice::smoke_test: no deb in formats — skipping the install check." ;;
          esac

          case ",$FORMATS," in
            *,appimage,*)
              APPIMAGE="${DIST}/${RK_PRODUCT}_${RK_VERSION}_${RK_ARCH}.AppImage"
              sudo apt-get install -y xvfb
              SMOKE="${RUNNER_TEMP}/smoke"
              rm -rf "$SMOKE" && mkdir -p "$SMOKE" && cd "$SMOKE"
              "$APPIMAGE" --appimage-extract >/dev/null
              set +e
              # smoke_args is a space-separated argument list, split on purpose.
              # shellcheck disable=SC2086
              timeout 15s xvfb-run -a ./squashfs-root/AppRun $SMOKE_ARGS > startup.log 2>&1
              STATUS=$?
              set -e
              cat startup.log
              if [ "$STATUS" -ne 124 ]; then
                echo "::error::$(basename "$APPIMAGE") exited during startup with status ${STATUS} (expected it still running at the 15 s timeout)"
                exit 1
              fi
              if grep -Ei 'panicked at|symbol lookup error|error while loading shared libraries' startup.log; then
                echo "::error::$(basename "$APPIMAGE") logged a panic or a dynamic-loader error during startup (above)"
                exit 1
              fi
              echo "$(basename "$APPIMAGE") was still running after 15 s."
              ;;
            *) echo "::notice::smoke_test: no appimage in formats — skipping the launch check." ;;
          esac

      # --clobber so a retry of this leg replaces its own assets instead of
      # 422-ing; assets from the OTHER leg are untouched. gh resolves a draft
      # release by tag_name, which is what lets this upload before publish.
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ needs.preflight.outputs.releases_owner }}/${{ needs.preflight.outputs.releases_name }}
        run: |
          set -euo pipefail
          ls -l "$DIST"
          gh release upload "$RK_TAG" "$DIST"/* --repo "$REPO" --clobber
          echo "Uploaded $(find "$DIST" -type f | wc -l) asset(s) for ${RK_TARGET} to ${REPO}@${RK_TAG}"

  # One SHA256SUMS over every artifact on the draft (both legs, including
  # ones a previous attempt uploaded) plus the SBOMs, GPG-signed when a key
  # is present. This is the only integrity check a standalone .deb gets, and
  # what the AUR and COPR recipes pin their checksums against.
  checksums:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SBOM describes the tagged source, same ref the legs built.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # The action's default (1.51.1) predates the fix for GHSA-mw2c-m758-9v5q.
          syft-version: v1.52.0

      # A source-level SBOM (every locked dependency Syft recognises —
      # Cargo.lock, go.sum, package-lock.json, …) in both formats scanners
      # ingest. Generated HERE, before SHA256SUMS is written, so the
      # manifest and its signature cover the SBOMs too and nothing has to
      # be re-signed afterwards.
      - name: Generate SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          PRODUCT: ${{ inputs.product_name }}
          BARE: ${{ needs.preflight.outputs.bare }}
        run: |
          set -euo pipefail
          SBOM="${RUNNER_TEMP}/sbom"
          mkdir -p "$SBOM"
          "$SYFT" scan dir:. --source-name "$PRODUCT" --source-version "$BARE" \
            -o "spdx-json=${SBOM}/${PRODUCT}_${BARE}.spdx.json" \
            -o "cyclonedx-json=${SBOM}/${PRODUCT}_${BARE}.cdx.json"
          ls -l "$SBOM"

      - name: Import signing key
        id: sign
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/linux-signing.asc"
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          gpg --batch --yes ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEY_ID="${LINUX_GPG_KEY_ID:-$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')}"
          printf '%s:6:\n' "$KEY_ID" | gpg --batch --import-ownertrust
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Generate, sign and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ needs.preflight.outputs.releases_owner }}/${{ needs.preflight.outputs.releases_name }}
          TAG: ${{ needs.preflight.outputs.version }}
          SIGNING: ${{ steps.sign.outputs.signing }}
          KEY_ID: ${{ steps.sign.outputs.key_id }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/sums"
          mkdir -p "$WORK" && cd "$WORK"
          gh release download "$TAG" --repo "$REPO" --dir . --clobber
          # A retry run's draft already carries the previous attempt's sums.
          rm -f SHA256SUMS SHA256SUMS.asc ./*.asc
          # This run's SBOMs replace any a previous attempt uploaded.
          cp "${RUNNER_TEMP}"/sbom/* .
          set -- *
          [ -e "$1" ] || { echo "::error::No assets on ${REPO}@${TAG} to checksum"; exit 1; }
          sha256sum -- "$@" > SHA256SUMS
          cat SHA256SUMS
          UPLOAD="SHA256SUMS $(cd "${RUNNER_TEMP}/sbom" && echo *)"
          if [ "$SIGNING" = "true" ]; then
            gpg --batch --yes -u "$KEY_ID" ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
            gpg --verify SHA256SUMS.asc SHA256SUMS
            # Also publish the public key next to the artifacts so `rpm
            # --import` and `gpg --verify` instructions can point at a URL
            # that moves with the release.
            gpg --armor --export "$KEY_ID" > "${KEY_ID}.asc"
            UPLOAD="${UPLOAD} SHA256SUMS.asc ${KEY_ID}.asc"
          fi
          # shellcheck disable=SC2086
          gh release upload "$TAG" $UPLOAD --repo "$REPO" --clobber

  # Build provenance for every file SHA256SUMS lists, once, after the last
  # asset is on the draft — one job holding id-token instead of one per leg.
  # The attestation is stored in the repository RUNNING this workflow (the
  # app repo), not in releases_repo; `gh attestation verify <file> --repo
  # <app repo> --signer-repo <this kit's repo>` checks it (docs/SIGNING.md).
  # --signer-repo is mandatory there because a reusable workflow signs.
  #
  # GitHub offers attestations for public repositories on every plan, but
  # for PRIVATE ones only on Enterprise Cloud. A private app repo on
  # Free/Pro/Team therefore fails the attest call; that is a plan limit, not
  # a broken release, so it is a warning and the release proceeds.
  attest:
    needs: [preflight, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # SHA256SUMS is read from the still-draft release
      id-token: write        # Sigstore signing certificate
      attestations: write    # store the attestation on this repository
    steps:
      - name: Download SHA256SUMS
        env:
          GH_TOKEN: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ needs.preflight.outputs.releases_owner }}/${{ needs.preflight.outputs.releases_name }}
          TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS --dir "${RUNNER_TEMP}/attest" --clobber
          cat "${RUNNER_TEMP}/attest/SHA256SUMS"

      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attest/SHA256SUMS

      - name: Report attestation outcome
        env:
          OUTCOME: ${{ steps.attest.outcome }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice::Build provenance attested for every file in SHA256SUMS (stored on ${GITHUB_REPOSITORY}). Verify with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-repo entro314-labs/linux-release-kit (or your fork of the kit)"
          elif [ "$PRIVATE" = "true" ]; then
            echo "::warning::Artifact attestation failed on private ${GITHUB_REPOSITORY}. Private repositories get attestations only on GitHub Enterprise Cloud; on Free/Pro/Team this is expected. The release continues without provenance."
          else
            echo "::warning::Artifact attestation failed on public ${GITHUB_REPOSITORY} (see the step above). The release continues without provenance; re-run the attest job to add it."
          fi

  # Fail loud BEFORE the draft flips public: every format for every SHIPPED
  # target (not just this run's build set) must be on the release, plus the
  # checksums — and their signature when signing is configured. Then every
  # asset's bytes are checked without downloading them: GitHub computes a
  # sha256 `digest` for each uploaded asset, and it must equal what
  # SHA256SUMS says for that file. That catches a truncated or half-failed
  # upload, and an asset re-uploaded (by a retried leg) after the checksums
  # job ran, which would otherwise publish a SHA256SUMS the file fails.
  verify-release:
    needs: [preflight, plan, create-release, build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Draft releases are invisible to a read-only token, so reading one needs write.
    permissions:
      contents: write
    steps:
      - name: Verify release assets (via API)
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
          BARE: ${{ needs.preflight.outputs.bare }}
          PRODUCT: ${{ inputs.product_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          FORMATS: ${{ needs.plan.outputs.formats }}
          SIGNING: ${{ needs.preflight.outputs.signing }}
          ZSYNC: ${{ inputs.appimage_update_info != '' }}
        with:
          github-token: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { RELEASE_ID, REL_OWNER, REL_NAME, BARE, PRODUCT, TARGETS, FORMATS, SIGNING, ZSYNC } = process.env;
            const owner = REL_OWNER;
            const repo = REL_NAME;
            const release_id = Number(RELEASE_ID);
            const legs = {
              'linux-x86_64':  { arch: 'x86_64',  deb: 'amd64', rpm: 'x86_64' },
              'linux-aarch64': { arch: 'aarch64', deb: 'arm64', rpm: 'aarch64' },
            };
            // '.' as GitHub stores it — see "Package .rpm".
            const rpmVersion = BARE.replace(/-/g, '.');
            const archPkgver = BARE.replace(/-/g, '');
            const expected = [];
            for (const t of TARGETS.split(',')) {
              const leg = legs[t];
              for (const f of FORMATS.split(',')) {
                if (f === 'deb') expected.push(`${PRODUCT}_${BARE}_${leg.deb}.deb`);
                if (f === 'rpm') expected.push(`${PRODUCT}-${rpmVersion}-1.${leg.rpm}.rpm`);
                if (f === 'appimage') {
                  expected.push(`${PRODUCT}_${BARE}_${leg.arch}.AppImage`);
                  if (ZSYNC === 'true') expected.push(`${PRODUCT}_${BARE}_${leg.arch}.AppImage.zsync`);
                }
                if (f === 'arch') {
                  expected.push(`${PRODUCT}-${archPkgver}-1-${leg.arch}.pkg.tar.zst`);
                  if (SIGNING === 'true') expected.push(`${PRODUCT}-${archPkgver}-1-${leg.arch}.pkg.tar.zst.sig`);
                }
              }
            }
            expected.push(`${PRODUCT}_${BARE}.spdx.json`, `${PRODUCT}_${BARE}.cdx.json`);
            expected.push('SHA256SUMS');
            if (SIGNING === 'true') expected.push('SHA256SUMS.asc');

            // The checksums job sums every asset except SHA256SUMS itself and
            // the *.asc files it uploads alongside (the signature and the
            // public key); everything else must have a SHA256SUMS line.
            const unsummed = (name) => name === 'SHA256SUMS' || name.endsWith('.asc');
            const list = (xs) => xs.slice(0, 10).join(', ') + (xs.length > 10 ? `, … (${xs.length} total)` : '');

            async function readSums(assets) {
              const sums = assets.find((a) => a.name === 'SHA256SUMS');
              if (!sums) return null;
              const { data } = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: sums.id, headers: { accept: 'application/octet-stream' },
              });
              const text = typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
              const map = new Map();
              for (const line of text.split('\n')) {
                const m = line.match(/^([a-f0-9]{64}) [ *](.+)$/);
                if (m) map.set(m[2], m[1]);
              }
              return map;
            }

            async function check() {
              const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
              const assets = release.assets;
              const byName = new Map(assets.map((a) => [a.name, a]));
              const checks = [];
              const add = (name, bad, what) => checks.push({
                name, ok: bad.length === 0, detail: bad.length ? `${what}: ${list(bad)}` : 'ok',
              });

              checks.push({ name: 'still a draft', ok: release.draft === true,
                detail: release.draft ? 'ok' : 'the release was published while this run was verifying it' });
              add('expected assets present', expected.filter((n) => !byName.has(n)), 'missing');
              add('no empty assets', assets.filter((a) => !(Number.isSafeInteger(a.size) && a.size > 0)).map((a) => a.name), 'size 0');
              add('GitHub sha256 digest present',
                assets.filter((a) => !/^sha256:[a-f0-9]{64}$/.test(String(a.digest || ''))).map((a) => a.name), 'no digest yet');

              const sums = await readSums(assets);
              if (!sums) {
                checks.push({ name: 'digests match SHA256SUMS', ok: false, detail: 'SHA256SUMS is not on the release' });
              } else {
                const mismatched = [];
                for (const [name, hash] of sums) {
                  const a = byName.get(name);
                  if (!a) mismatched.push(`${name} (listed, not on the release)`);
                  else if (a.digest && a.digest !== `sha256:${hash}`) mismatched.push(`${name} (${a.digest} ≠ sha256:${hash})`);
                }
                for (const a of assets) {
                  if (!unsummed(a.name) && !sums.has(a.name)) mismatched.push(`${a.name} (not in SHA256SUMS)`);
                }
                add('digests match SHA256SUMS', mismatched, 'mismatch');
              }
              return { release, checks };
            }

            // GitHub fills `digest` in asynchronously after an upload, so a
            // failure is re-read a few times before it counts.
            const ATTEMPTS = 8;
            let result;
            for (let attempt = 1; attempt <= ATTEMPTS; attempt++) {
              result = await check();
              const failing = result.checks.filter((c) => !c.ok);
              if (!failing.length) break;
              if (attempt < ATTEMPTS) {
                core.info(`Attempt ${attempt}/${ATTEMPTS}: ${failing.map((c) => c.name).join('; ')} — re-reading in 5 s`);
                await new Promise((r) => setTimeout(r, 5000));
              }
            }
            const { release, checks } = result;
            // Outputs first: the summary step reads them even when this fails.
            core.setOutput('asset_count', String(release.assets.length));
            core.setOutput('html_url', release.html_url);
            core.setOutput('checks', JSON.stringify(checks.map((c) => ({
              ...c, detail: c.detail.replace(/\|/g, '\\|').replace(/\n/g, ' '),
            }))));
            const failed = checks.filter((c) => !c.ok);
            if (failed.length) {
              core.setFailed(`Release ${release.tag_name} on ${owner}/${repo} failed verification:\n  - ${failed.map((c) => `${c.name}: ${c.detail}`).join('\n  - ')}\nPresent: ${release.assets.map((a) => a.name).join(', ')}`);
              return;
            }
            core.info(`Verified ${expected.length} expected assets and ${release.assets.length} digests on ${owner}/${repo} release ${release.tag_name}.`);

      # Written even when verification fails, so a red run explains itself on
      # its summary page.
      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
          HTML_URL: ${{ steps.verify.outputs.html_url }}
          ASSET_COUNT: ${{ steps.verify.outputs.asset_count }}
          CHECKS: ${{ steps.verify.outputs.checks }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## Release verification: ${VERSION}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Release (draft) | ${HTML_URL:-https://github.com/${REL_OWNER}/${REL_NAME}/releases} |"
            echo "| Assets | ${ASSET_COUNT:-unknown} |"
            echo "| Verification | ${OUTCOME} |"
            if [ -n "${CHECKS:-}" ]; then
              echo
              echo "| Check | Result | Detail |"
              echo "| --- | --- | --- |"
              jq -r '.[] | "| \(.name) | \(if .ok then "pass" else "**FAIL**" end) | \(.detail) |"' <<<"$CHECKS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: [preflight, plan, create-release, verify-release, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Publish release
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        with:
          github-token: ${{ inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = process.env.REL_OWNER, repo = process.env.REL_NAME;
            // GitHub's default make_latest is "the release published most
            // recently", not the highest version. `releases/latest` is what the
            // AppImage zsync update info and the Nix template follow, so a
            // hotfix on an older line published after a newer release would
            // hand every client a downgrade. A prerelease never takes latest;
            // a stable release takes it unless the current latest is higher.
            // Same rule and comparison as tauri-release-kit's publish step.
            const parse = (v) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(v);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3]), m[4] ?? null] : null;
            };
            const compare = (a, b) => {
              for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] - b[i];
              if (a[3] === null && b[3] === null) return 0;
              if (a[3] === null) return 1;
              if (b[3] === null) return -1;
              const x = a[3].split('.'), y = b[3].split('.');
              for (let i = 0; i < Math.max(x.length, y.length); i += 1) {
                if (x[i] === undefined) return -1;
                if (y[i] === undefined) return 1;
                if (x[i] === y[i]) continue;
                const nx = /^\d+$/.test(x[i]), ny = /^\d+$/.test(y[i]);
                if (nx && ny) return Number(x[i]) - Number(y[i]);
                if (nx !== ny) return nx ? -1 : 1;
                return x[i] < y[i] ? -1 : 1;
              }
              return 0;
            };
            let makeLatest = 'true';
            try {
              const { data: current } = await github.rest.repos.getLatestRelease({ owner, repo });
              const mine = parse(process.env.VERSION);
              const theirs = parse(current.tag_name);
              if (mine && theirs && compare(mine, theirs) < 0) {
                makeLatest = 'false';
                core.warning(`${process.env.VERSION} is below the current latest ${current.tag_name}; publishing without taking releases/latest`);
              }
            } catch (error) {
              if (error.status !== 404) throw error; // no latest yet: this one is it
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: makeLatest,
            });

      # Now that the release is public, SHA256SUMS must resolve for an
      # UNAUTHENTICATED client — that is what every user, AUR helper and COPR
      # builder is. This can only pass when the releases repo is PUBLIC.
      - name: Smoke-test public download URL
        id: public_url
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REL_OWNER}/${REL_NAME}/releases/download/${VERSION}/SHA256SUMS"
          CODE=000
          for _ in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -A release-verify "$URL") && [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::SHA256SUMS not publicly reachable: HTTP $CODE $URL — is ${REL_OWNER}/${REL_NAME} public?"; exit 1; }
          echo "::notice::Published ${VERSION}: https://github.com/${REL_OWNER}/${REL_NAME}/releases/tag/${VERSION}"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REL_OWNER: ${{ needs.preflight.outputs.releases_owner }}
          REL_NAME: ${{ needs.preflight.outputs.releases_name }}
          PUBLISH: ${{ steps.publish.outcome }}
          PUBLIC_URL: ${{ steps.public_url.outcome }}
        run: |
          {
            echo "## Publish: ${VERSION}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Draft flipped to published | ${PUBLISH} |"
            echo "| SHA256SUMS reachable anonymously | ${PUBLIC_URL} |"
            echo
            echo "Release: https://github.com/${REL_OWNER}/${REL_NAME}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
